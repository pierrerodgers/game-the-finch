<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>game the finch</title>
    <link rel="icon" type="image/png" href="/favicon.png"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ff9862;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .container {
            position: relative;
            width: 90%;
            max-width: 1600px;
            margin: 0 auto;
        }

        .bar-container {
            position: relative;
            width: 100%;
        }

        .bar-image {
            width: 100%;
            height: auto;
            display: block;
        }

        .nav-icons {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            padding: 0 5%;
            pointer-events: none;
        }

        .nav-icons > * {
            pointer-events: auto;
        }

        .labels-container {
            position: absolute;
            top: calc(100% - 70px);
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-evenly;
            padding: 0 5%;
            gap: 0;
            pointer-events: none;
        }

        .labels-container > * {
            pointer-events: auto;
        }

        .label-item {
            position: relative;
            display: flex;
            justify-content: center;
        }

        .label-item:nth-child(1) {
            width: 29%;
            max-width: 300px;
        }

        .label-item:nth-child(2) {
            width: 27%;
            max-width: 280px;
        }

        .label-item:nth-child(3) {
            width: 24%;
            max-width: 240px;
        }

        .label-item:nth-child(4) {
            width: 27%;
            max-width: 280px;
        }

        .label-item:nth-child(5) {
            width: 15%;
            max-width: 200px;
        }

        .icon-link {
            width: 24%;
            max-width: 240px;
            transition: transform 0.3s ease, opacity 0.3s ease;
            display: block;
        }

        .icon-link:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }

        .icon-link img {
            width: 100%;
            height: auto;
            display: block;
        }

        .icon-wrapper {
            display: contents;
        }

        .icon-gif {
            width: 100%;
            height: auto;
            will-change: transform;
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        .icon-wrapper .icon-label {
            display: none;
        }

        .labels-container .icon-label {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%) scale(1.1);
            display: block;
            width: auto;
            max-width: 300px;
            height: auto;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .label-item:nth-child(1) .icon-label {
            top: 30px;
        }

        .container:has(.icon-substack:hover) .label-item:nth-child(1) .icon-label,
        .container:has(.icon-reel:hover) .label-item:nth-child(2) .icon-label,
        .container:has(.icon-book:hover) .label-item:nth-child(3) .icon-label,
        .container:has(.icon-sparks:hover) .label-item:nth-child(4) .icon-label,
        .container:has(.icon-archive:hover) .label-item:nth-child(5) .icon-label {
            opacity: 1;
        }

        /* Individual icon sizes */
        .icon-substack {
            width: 29%;
            max-width: 300px;
            align-self: center;
        }

        .icon-reel {
            width: 27%;
            max-width: 280px;
        }

        .icon-book {
            width: 24%;
            max-width: 240px;
        }

        .icon-sparks {
            width: 27%;
            max-width: 280px;
            transform: scale(1.6);
        }

        .icon-sparks:hover {
            transform: scale(1.76);
            opacity: 0.8;
        }

        .icon-archive {
            width: 15%;
            max-width: 200px;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .container {
                width: 100%;
                max-width: none;
            }

            .labels-container {
                display: none;
            }

            .icon-wrapper {
                display: flex;
                flex-direction: column;
                align-items: center;
                width: 80%;
                max-width: 400px;
                gap: 5px;
            }

            .icon-wrapper .icon-label {
                display: block;
            }

            .bar-container {
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                padding: 50px 0;
                padding-bottom: 50px;
            }

            .bar-image {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%) rotate(90deg);
                width: 350vh;
                max-width: none;
                height: 100vw;
            }

            .nav-icons {
                position: relative;
                z-index: 10;
                flex-direction: column;
                padding: 5% 0;
                gap: 25px;
            }

            .icon-wrapper {
                display: flex;
                flex-direction: column;
                align-items: center;
                width: 80%;
                max-width: 400px;
                gap: 5px;
            }

            .icon-wrapper:nth-child(3),
            .icon-wrapper:nth-child(4),
            .icon-wrapper:nth-child(5) {
                margin-bottom: -175px;
            }
            .icon-wrapper:nth-child(2) .icon-label {
                padding-bottom: -70px;
            }
            .icon-wrapper:nth-child(1) .icon-label {
                padding-bottom: 40px;
            }

            .icon-wrapper:nth-child(3) .icon-label {
                padding-bottom: 180px;
            }

            .icon-link {
                width: 100%;
                max-width: none;
            }

            .icon-substack,
            .icon-reel,
            .icon-book,
            .icon-sparks,
            .icon-archive {
                width: 100%;
                max-width: none;
                transform: none;
            }

            .icon-book {
                transform: scale(0.9);
            }

            .icon-sparks {
                transform: scale(1.3);
            }

            .icon-sparks:hover {
                transform: scale(1.4);
            }

            .icon-archive {
                transform: scale(0.5);
            }

            .icon-wrapper:has(.icon-archive) {
                gap: 0;
            }

            .icon-wrapper:has(.icon-archive) .icon-label {
                margin-top: -50%;
            }

            .icon-wrapper:has(.icon-book) .icon-label {
                margin-top: -10%;
            }

            .icon-label {
                display: block;
                width: 80%;
                max-width: 200px;
                transform: scale(1.25);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="bar-container">
            <img src="/new-assets/bar_only.png" alt="Navigation Bar" class="bar-image">
            <div class="nav-icons">
                <div class="icon-wrapper">
                    <a href="https://fergstack.substack.com" target="_blank" class="icon-link icon-substack">
                        <img src="/new-assets/gif_finals/Substack-A.gif" alt="Substack" class="icon-gif">
                    </a>
                    <img src="/new-assets/labels/substack_label.png" alt="Substack" class="icon-label">
                </div>
                <div class="icon-wrapper">
                    <a href="https://vimeo.com/1081909242?fl=pl&fe=vl" target="_blank" class="icon-link icon-reel">
                        <img src="/new-assets/gif_finals/reel_icon_final.gif?v=1763262037" alt="Reel" class="icon-gif">
                    </a>
                    <img src="/new-assets/labels/reel_label.png" alt="Reel" class="icon-label">
                </div>
                <div class="icon-wrapper">
                    <a href="https://www.buildweekproductions.com/sankyostream/p/coffeetablebook" target="_blank" class="icon-link icon-book">
                        <img src="/new-assets/gif_finals/book_icon.gif" alt="Book" class="icon-gif">
                    </a>
                    <img src="/new-assets/labels/book_label.png" alt="Book" class="icon-label">
                </div>
                <div class="icon-wrapper">
                    <a href="/new-assets/Rager_Poster.jpg" target="_blank" class="icon-link icon-sparks">
                        <img src="/new-assets/gif_finals/sparks_logo_final.gif?v=1763262037" alt="Sparks" class="icon-gif">
                    </a>
                    <img src="/new-assets/labels/coming_soon_label.png" alt="Coming Soon" class="icon-label">
                </div>
                <div class="icon-wrapper">
                    <a href="/archive/home.html" class="icon-link icon-archive">
                        <img src="/new-assets/gif_finals/sankyo_flies.gif" alt="Sankyo Files" class="icon-gif">
                    </a>
                    <img src="/new-assets/labels/site_archive_label.png" alt="Site Archive" class="icon-label">
                </div>
            </div>
            <div class="labels-container">
                <div class="label-item">
                    <img src="/new-assets/labels/substack_label.png" alt="Substack" class="icon-label">
                </div>
                <div class="label-item">
                    <img src="/new-assets/labels/reel_label.png" alt="Reel" class="icon-label">
                </div>
                <div class="label-item">
                    <img src="/new-assets/labels/book_label.png" alt="Book" class="icon-label">
                </div>
                <div class="label-item">
                    <img src="/new-assets/labels/coming_soon_label.png" alt="Coming Soon" class="icon-label">
                </div>
                <div class="label-item">
                    <img src="/new-assets/labels/site_archive_label.png" alt="Site Archive" class="icon-label">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
